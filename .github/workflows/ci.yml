name: CI

# O repositório não tinha nenhuma verificação registrada: a única evidência de
# que os testes passavam vinha do ambiente da Lovable. Isto torna teste, lint e
# build verificáveis por qualquer pessoa, a cada push e a cada pull request.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Testes
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
